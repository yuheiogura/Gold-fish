<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日式金魚餵食體驗</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif, 'Microsoft JhengHei';
            background-color: #e8d3b9; /* より明るい泥土色 */
            color: #ecf0f1;
            text-align: center;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            color: #fff; 
        }
        .ui-panel {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .btn-summon {
            background-color: #e84393; 
            color: white;
            border: 2px solid #fd79a8;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #b71540;
            transition: all 0.1s;
        }
        .btn-summon:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b71540;
        }
        #status-area {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2ecc71;
            background-color: #2d3436;
            padding: 10px;
            border-radius: 5px;
            transition: color 0.3s;
        }
        .warning-text {
            color: #e74c3c !important;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            border: 6px solid #a08060; 
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            background-color: #f4e1c1; /* 最背景の明るい土色 */
        }
        canvas {
            display: block;
            width: 100%;
            cursor: crosshair;
        }
        .instruction {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>日式金魚餵食體驗</h1>

    <div class="ui-panel">
        <button class="btn-summon" onclick="summonFishes()">🐟 招喚金魚</button>
        <div id="status-area">水質狀態：清澈良好</div>
    </div>

    <div class="canvas-container">
        <canvas id="fishCanvas" width="700" height="450"></canvas>
    </div>
    
    <div class="instruction">點擊水面撒下飼料，觀察金魚加速索食的可愛模樣。</div>

    <script>
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d');
        const statusArea = document.getElementById('status-area');
        
        let fishes = [];
        let foods = [];
        let rocks = [];
        let petals = [];
        let isWaterDirty = false;
        let waterColor = '#85c1e9'; 

        // 池の形状と位置
        const pondCx = canvas.width / 2 + 15;
        const pondCy = canvas.height / 2;
        const pondRx = canvas.width / 2 - 80; 
        const pondRy = canvas.height / 2 - 60; 

        // 鹿威（ししおどし）制御用
        let shishiAngle = 0;
        let shishiTimer = 0;

        // --- 桜の花びらの生成 ---
        for(let i=0; i<35; i++){
            petals.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 4,
                speedY: Math.random() * 1 + 0.8,
                speedX: (Math.random() - 0.5) * 1.5,
                angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.1
            });
        }

        // --- 池を囲む石の生成 ---
        function generateScenery() {
            rocks = [];
            for (let angle = 0; angle < Math.PI * 2; angle += 0.1) {
                const size = 10 + Math.random() * 14; 
                const rOffset = size * 0.6; 
                const x = pondCx + Math.cos(angle) * (pondRx + rOffset);
                const y = pondCy + Math.sin(angle) * (pondRy + rOffset);
                
                rocks.push({ 
                    x: x + (Math.random() - 0.5) * 5, 
                    y: y + (Math.random() - 0.5) * 5, 
                    size: size 
                });
            }
        }
        generateScenery();

        // --- 時間による背景色の設定 ---
        function setTimeBackground() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 16) {
                waterColor = '#85c1e9'; // 早晨/白天
            } else if (hour >= 16 && hour < 19) {
                waterColor = '#e67e22'; // 傍晚
            } else {
                waterColor = '#1f456e'; // 夜晚
            }
        }
        setTimeBackground();
        setInterval(setTimeBackground, 60000); 

        // --- 松の木（鮮やかな緑色）の描画関数 ---
        function drawPineTree(x, y, scale, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.scale(scale, scale);

            // 幹（枝）
            ctx.fillStyle = '#5c4033'; 
            ctx.beginPath();
            ctx.moveTo(20, -10);
            ctx.quadraticCurveTo(-40, 40, -130, 90);
            ctx.quadraticCurveTo(-40, 60, 20, 10);
            ctx.fill();

            // 葉（明るく鮮やかな緑色）
            const drawNeedles = (nx, ny, rx, ry) => {
                // 影の部分
                ctx.fillStyle = '#27ae60'; 
                ctx.beginPath();
                ctx.ellipse(nx, ny + 5, rx, ry, 0, 0, Math.PI * 2);
                ctx.fill();
                // 明るい部分
                ctx.fillStyle = '#2ecc71'; 
                ctx.beginPath();
                ctx.ellipse(nx, ny, rx, ry, 0, 0, Math.PI * 2);
                ctx.fill();
            };

            // 枝に沿って葉の塊を配置
            drawNeedles(-120, 85, 35, 20);
            drawNeedles(-80, 60, 45, 25);
            drawNeedles(-35, 35, 50, 30);
            drawNeedles(-150, 100, 25, 15);
            drawNeedles(-100, 105, 30, 18);

            ctx.restore();
        }

        // --- 魚のクラス定義 ---
        class Fish {
            constructor() {
                const rand = Math.random();
                if (rand < 0.6) {
                    this.type = 'wakin'; 
                    this.color = '#e74c3c'; 
                    this.width = 22; this.height = 9; 
                    this.speedBase = 0.3; 
                    this.speedRush = 2.2; 
                } else if (rand < 0.9) {
                    this.type = 'demekin'; 
                    this.color = '#1a1a1a'; 
                    this.width = 18; this.height = 14; 
                    this.speedBase = 0.2;
                    this.speedRush = 1.8;
                } else {
                    this.type = 'ranchu'; 
                    this.color = '#f39c12'; 
                    this.width = 26; this.height = 16; 
                    this.speedBase = 0.15; 
                    this.speedRush = 1.3;
                }

                this.x = pondCx + (Math.random() - 0.5) * pondRx * 0.8;
                this.y = pondCy + (Math.random() - 0.5) * pondRy * 0.8;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = this.speedBase;
                this.eatPause = 0;
            }

            drawEyes(eyeRadius, pupilRadius, offsetX, offsetY) {
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(offsetX, -offsetY, eyeRadius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(offsetX + 1, -offsetY, pupilRadius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(offsetX, offsetY, eyeRadius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(offsetX + 1, offsetY, pupilRadius, 0, Math.PI*2); ctx.fill();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = this.color;
                ctx.beginPath();

                if (this.type === 'wakin') {
                    ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                    ctx.moveTo(-this.width/2, 0); ctx.lineTo(-this.width/2 - 12, -6); ctx.lineTo(-this.width/2 - 12, 6);
                    ctx.fill();
                    this.drawEyes(2.5, 1.2, this.width/4, this.height/2 - 1.5);
                } else if (this.type === 'demekin') {
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(this.width/4, -this.height/2 - 2, 4.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(this.width/4, this.height/2 + 2, 4.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(-this.width/2, 0); ctx.lineTo(-this.width/2 - 10, -8); ctx.lineTo(-this.width/2 - 10, 8); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath(); ctx.arc(this.width/4 + 1, -this.height/2 - 2, 2, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(this.width/4 + 1, this.height/2 + 2, 2, 0, Math.PI*2); ctx.fill();
                } else if (this.type === 'ranchu') {
                    ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(243, 156, 18, 0.7)';
                    ctx.moveTo(-this.width/2 + 5, 0); ctx.lineTo(-this.width/2 - 18, -16); 
                    ctx.lineTo(-this.width/2 - 8, 0); ctx.lineTo(-this.width/2 - 18, 16);
                    ctx.fill();
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2); ctx.fill();
                    this.drawEyes(2.5, 1.2, this.width/3, this.height/2 - 3);
                }
                ctx.restore();
            }

            update() {
                if (this.eatPause > 0) { this.eatPause--; return; }

                if (foods.length > 0) {
                    let minDist = Infinity;
                    let closestFood = null;
                    for (let f of foods) {
                        let d = Math.hypot(f.x - this.x, f.y - this.y);
                        if (d < minDist) { minDist = d; closestFood = f; }
                    }
                    if (closestFood) {
                        let targetAngle = Math.atan2(closestFood.y - this.y, closestFood.x - this.x);
                        let angleDiff = targetAngle - this.angle;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        
                        this.angle += angleDiff * 0.15; 
                        this.speed += (this.speedRush - this.speed) * 0.1; 

                        if (minDist < this.width / 2 + 6) {
                            const index = foods.indexOf(closestFood);
                            if (index > -1) foods.splice(index, 1);
                            this.eatPause = 30; 
                            checkWaterQuality();
                        }
                    }
                } else {
                    this.speed += (this.speedBase - this.speed) * 0.05; 
                    if (Math.random() < 0.02) this.angle += (Math.random() - 0.5) * 0.8;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                const distToCenter = Math.pow((this.x - pondCx) / pondRx, 2) + Math.pow((this.y - pondCy) / pondRy, 2);
                if (distToCenter > 0.85) { 
                    const angleToCenter = Math.atan2(pondCy - this.y, pondCx - this.x);
                    let turnDiff = angleToCenter - this.angle;
                    while (turnDiff > Math.PI) turnDiff -= Math.PI * 2;
                    while (turnDiff < -Math.PI) turnDiff += Math.PI * 2;
                    this.angle += turnDiff * 0.1;
                }
            }
        }

        // --- 餌のクラス定義 ---
        class Food {
            constructor(x, y) {
                this.x = x; this.y = y; this.size = 2.5;
            }
            draw() {
                ctx.fillStyle = '#6d4c41';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        // --- 鹿威（ししおどし）と水流を描く ---
        function drawShishiOdoshi() {
            ctx.save();
            const shishiX = pondCx - pondRx - 20;
            const shishiY = pondCy - 30;
            ctx.translate(shishiX, shishiY);

            // 土台の石
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath(); ctx.ellipse(0, 30, 20, 10, 0, 0, Math.PI * 2); ctx.fill();

            // 支柱
            ctx.fillStyle = '#556b2f'; 
            ctx.fillRect(-8, -15, 6, 45);
            ctx.fillRect(4, -15, 6, 45);

            // 動く竹筒
            shishiTimer += 0.025;
            let tilt = Math.sin(shishiTimer);
            if (tilt > 0.85) {
                shishiAngle = Math.PI / 4; 
            } else {
                shishiAngle = Math.max(-Math.PI / 10, shishiAngle - 0.04); 
            }

            ctx.translate(0, -5);
            ctx.rotate(shishiAngle);
            ctx.fillStyle = '#6b8e23';
            ctx.fillRect(-35, -8, 60, 14);
            ctx.fillStyle = '#222';
            ctx.fillRect(20, -6, 5, 10);

            ctx.restore();

            // 水流
            if (shishiAngle > 0.5) {
                ctx.save();
                ctx.translate(shishiX, shishiY - 5);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.moveTo(25, 20); 
                ctx.lineTo(35, 70); 
                ctx.lineTo(15, 70);
                ctx.fill();
                
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.ellipse(25, 70, 15, 4, 0, 0, Math.PI*2);
                ctx.stroke();
                ctx.restore();
            }
        }

        // --- アクション関数 ---
        function summonFishes() {
            fishes = [];
            const num = Math.floor(Math.random() * 4) + 4; 
            for(let i=0; i<num; i++) fishes.push(new Fish());
        }

        function scatterFood(centerX, centerY) {
            const numFoods = Math.floor(Math.random() * 4) + 5; 
            for(let i=0; i<numFoods; i++) {
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = (Math.random() - 0.5) * 60;
                const dropX = centerX + offsetX;
                const dropY = centerY + offsetY;
                
                const dist = Math.pow((dropX - pondCx) / pondRx, 2) + Math.pow((dropY - pondCy) / pondRy, 2);
                if(dist <= 0.9) {
                    foods.push(new Food(dropX, dropY));
                }
            }
            checkWaterQuality();
        }

        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            scatterFood(x, y);
        });

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            scatterFood(x, y);
        }, {passive: false});

        function checkWaterQuality() {
            if (foods.length >= 40 && !isWaterDirty) {
                isWaterDirty = true;
                statusArea.innerHTML = '⚠️ 注意！飼料給太多，水質正在惡化！';
                statusArea.classList.add('warning-text');
            } else if (foods.length < 40 && isWaterDirty) {
                if(foods.length === 0){
                    isWaterDirty = false;
                    statusArea.innerHTML = '水質狀態：清澈良好';
                    statusArea.classList.remove('warning-text');
                }
            }
        }

        // --- メインループ ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 明るい土の背景
            ctx.fillStyle = '#f4e1c1'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 松の木（背景側：右下から池にかかる）
            // 角度を180度（Math.PI）回して右下から左上へ伸ばす
            drawPineTree(canvas.width - 20, canvas.height - 20, 1.2, Math.PI);

            // 3. 池
            ctx.fillStyle = isWaterDirty ? '#4b5320' : waterColor;
            ctx.beginPath();
            ctx.ellipse(pondCx, pondCy, pondRx, pondRy, 0, 0, Math.PI * 2);
            ctx.fill();

            // 4. 石（池を緊密に囲む）
            for (let r of rocks) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.size, 0, Math.PI * 2);
                ctx.fillStyle = '#95a5a6'; 
                ctx.fill();
                ctx.beginPath();
                ctx.arc(r.x + 2, r.y + 2, r.size - 2, 0, Math.PI * 2);
                ctx.fillStyle = '#7f8c8d'; 
                ctx.fill();
            }

            // 5. 鹿威（ししおどし）と水流
            drawShishiOdoshi();

            // 6. 餌と魚
            for (let f of foods) f.draw();
            for (let fish of fishes) {
                fish.update();
                fish.draw();
            }

            // 7. 松の木（手前側：右上から池にかかる）
            // 角度0で右上から左下へ伸ばす
            drawPineTree(canvas.width - 10, -10, 1.2, 0);

            // 8. 桜の花びら（最前面）
            for (let p of petals) {
                p.y += p.speedY;
                p.x += p.speedX + Math.sin(p.y * 0.03) * 0.6; 
                p.angle += p.spin;
                
                if(p.y > canvas.height + 10) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = 'rgba(255, 183, 197, 0.9)'; 
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        summonFishes();
        animate();

    </script>
</body>
</html>
